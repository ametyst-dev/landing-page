name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # Deliberately the same job name every other repo in this org uses, so a
    # single org-level `required_status_checks` context covers this repo too.
    # 10 of the 11 repos that already had CI use exactly this string.
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm, not pnpm — this repo checks in a package-lock.json.
      - name: Install dependencies
        run: npm ci

      # ⛔ `lint` is NOT run here, and that is a deliberate gap rather than an
      # oversight. `package.json`'s lint script is `next lint`, which with no
      # ESLint config in the repo is INTERACTIVE: it prompts to choose a config
      # and exits 1. In CI that is a job that fails for a reason unrelated to the
      # code, which is worse than no lint at all. Giving this repo a real ESLint
      # config is tracked separately; until then the job name's "Lint" is
      # inherited from the org-wide context name, not a claim that lint runs.

      - name: Test
        run: npm test

      # `next build` type-checks the whole app as part of the build, so there is
      # no separate typecheck step to add: a type error fails here.
      - name: Build
        run: npm run build
